[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-scoreboard"
version = "0.1.0"
description = "Compare saved LLM evaluation runs using exact-match accuracy, latency and declared cost."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
llm-eval-scoreboard = "eval_scoreboard.core:main"

[tool.setuptools.packages.find]
include = ["eval_scoreboard*"]
